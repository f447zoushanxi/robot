# =============================================================================
# 配置文件：locations.yaml — 家庭地点坐标表
# =============================================================================
# 这个文件记录家里各个位置的坐标（x, y, yaw）。
#
# 字段说明：
#   name : 地点名称（中文，机器人导航时用这个名字查找）
#   x    : 在地图坐标系中的 X 方向位置（单位：米，向右为正）
#   y    : 在地图坐标系中的 Y 方向位置（单位：米，向上为正）
#   yaw  : 到达后机器人朝向的角度（单位：弧度；0=朝右，1.57=朝前，3.14=朝左）
#
# 修改这个文件后，需要重新构建并重启节点：
#   colcon build --packages-select robot_bringup
#   ros2 launch robot_bringup dev_sim.launch.py
# =============================================================================

locations:
  - {name: 客厅, x: 0.0, y: 0.0, yaw: 0.0}
  - {name: 厨房, x: 2.0, y: 0.5, yaw: 1.57}
  - {name: 卧室, x: -1.5, y: 1.2, yaw: 3.14}
  - {name: 卫生间, x: -2.0, y: -0.8, yaw: -1.57}
  - {name: 阳台, x: 1.2, y: -1.8, yaw: 0.0}
  - {name: 入户门口, x: 3.0, y: 0.0, yaw: 0.0}
  - {name: 充电座, x: -0.5, y: -0.2, yaw: 3.14}
  - {name: 餐桌旁, x: 1.0, y: 1.0, yaw: 1.57}  # 默认交付点（handover_spot）

