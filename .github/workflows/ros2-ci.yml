name: ROS2 Colcon CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: ros:humble-ros-base

    # NOTE:
    # - We need Bash because we source ROS 2 environment via `setup.bash`.
    # - Do NOT use `-u` (nounset) in CI shell options, because ROS setup scripts
    #   (setup.bash) intentionally reference optional env vars.
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -eux
          apt-get update
          apt-get install -y \
            bash \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-ament-cmake-gtest \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-launch-testing \
            ros-humble-launch-testing-ament-cmake \
            libyaml-cpp-dev

      - name: Build workspace
        working-directory: ros_ws
        run: |
          set -ex
          # setup.bash is not nounset-safe, so make sure `set -u` is not enabled.
          set +u
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test workspace
        working-directory: ros_ws
        run: |
          set -ex
          set +u
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Python compile checks
        run: |
          set -eux
          python3 -m py_compile ros_ws/src/robot_perception/robot_perception/perception_node.py
